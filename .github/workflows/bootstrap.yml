name: Import Yardline source
on:
  push:
    paths:
      - ".bootstrap/source.br.b64"
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extract reviewed project source
        run: |
          node - <<'JS'
          const {readFileSync,writeFileSync}=require('node:fs');
          const {brotliDecompressSync}=require('node:zlib');
          const source=readFileSync('.bootstrap/source.br.b64','utf8').trim();
          writeFileSync('/tmp/yardline.tar',brotliDecompressSync(Buffer.from(source,'base64')));
          JS
          tar -xf /tmp/yardline.tar -C .
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Yardline full-stack operations application"
          git push origin HEAD:main
