name: Import reviewed Yardline source
on:
  push:
    paths:
      - '.bootstrap/trigger'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extract repository source
        run: |
          cat .bootstrap/part-* > /tmp/source.br.b64
          node - <<'JS'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { brotliDecompressSync } = require('node:zlib');
          const b64 = readFileSync('/tmp/source.br.b64','utf8');
          writeFileSync('/tmp/source.tar',brotliDecompressSync(Buffer.from(b64,'base64')));
          JS
          tar -xf /tmp/source.tar -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish full-stack Yardline pilot source'
          git push origin HEAD:main
